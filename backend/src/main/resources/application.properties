spring.application.name=license


server.port=9090
server.address=0.0.0.0

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/p5_license_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------------------------------------------------------------------------
# Engagement features (push, in-app messages, chat). Both values are optional;
# leaving them empty keeps the new admin/push-sending features switched off.
# ---------------------------------------------------------------------------
# Secret for admin actions (send push, manage in-app messages, reply to chats).
# Sent by the dashboard/curl as the X-Admin-Token header. Empty = disabled.
plumb5.admin.token=
# Path to a Firebase service-account JSON file; enables real FCM sending.
firebase.credentials.path=
